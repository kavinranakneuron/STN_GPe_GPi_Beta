# PD smoke config — short PD-condition run for Phase 2 step 8.

name: pd_smoke
condition: pd

target_rate_stn_Hz: 27.0
target_rate_gpe_Hz: 41.0
target_rate_gpi_Hz: 63.0
target_cv_stn: 0.6
target_cv_gpe: 0.40
target_cv_gpi: 0.30
beta_threshold: 0.15

n_stn: 100
n_gpe: 200
n_gpi: 150

dt_ms: 0.025
duration_ms: 200.0
burn_in_ms: 50.0

bounds:
  g_stn_gpe: [0.05, 0.5]
  g_stn_gpi: [0.05, 0.5]
  g_gpe_stn: [0.005, 0.1]
  g_gpe_gpi: [0.01, 0.3]
  I_drive_stn: [-5.0, 5.0]
  I_drive_gpe: [-5.0, 5.0]
  I_drive_gpi: [-5.0, 5.0]
  mu_stn: [-5.0, 5.0]
  mu_gpe: [-5.0, 5.0]
  mu_gpi: [-5.0, 5.0]
  sigma_stn: [0.0, 5.0]
  sigma_gpe: [0.0, 5.0]
  sigma_gpi: [0.0, 5.0]

w_rate: 1.0
w_cv: 0.2
constraint_mode: constraint

n_trials: 100
cma_seed: 42
network_seed: 42
init_seed: 7
ou_seed_base: 1
