# PD optimization study with asymmetric synaptic-conductance bounds.
#
# Asymmetric bounds reflect literature priors on the direction of PD
# changes (Albin et al. 1989, Trends Neurosci 12(10):366-375;
# Tachibana et al. 2014; Bergman et al. 1994):
#   - g_STN→GPe biased higher (excitation up)
#   - g_GPe→STN biased lower (indirect-pathway disinhibition)
#   - g_STN→GPi biased higher
#   - g_GPe→GPi biased lower
#
# Drives, OU mu, OU sigma stay symmetric (no strong prior on these).

name: pd_asymmetric
condition: pd

# Targets (Tachibana et al. 2014)
target_rate_stn_Hz: 27.0
target_rate_gpe_Hz: 41.0
target_rate_gpi_Hz: 63.0
target_cv_stn: 0.6
target_cv_gpe: 0.40
target_cv_gpi: 0.30
beta_threshold: 0.15    # PD: STN beta fraction must be > 0.15
beta_band: [13.0, 30.0]
broadband: [1.0, 100.0]

# Network sizes
n_stn: 100
n_gpe: 200
n_gpi: 150

# Numerical
dt_ms: 0.025
duration_ms: 400.0
burn_in_ms: 100.0

bounds:
  g_stn_gpe: [0.05, 0.5]    # biased toward higher excitation
  g_stn_gpi: [0.05, 0.5]
  g_gpe_stn: [0.005, 0.1]   # biased toward lower inhibition
  g_gpe_gpi: [0.01, 0.3]
  I_drive_stn: [-5.0, 5.0]
  I_drive_gpe: [-5.0, 5.0]
  I_drive_gpi: [-5.0, 5.0]
  mu_stn: [-5.0, 5.0]
  mu_gpe: [-5.0, 5.0]
  mu_gpi: [-5.0, 5.0]
  sigma_stn: [0.0, 5.0]
  sigma_gpe: [0.0, 5.0]
  sigma_gpi: [0.0, 5.0]

w_rate: 1.0
w_cv: 0.2
constraint_mode: constraint

n_trials: 1500
cma_seed: 42
network_seed: 42
init_seed: 7
ou_seed_base: 1
