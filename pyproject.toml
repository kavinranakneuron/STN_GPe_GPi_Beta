[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgnet"
version = "0.1.0"
description = "GPU-accelerated spiking-network framework for basal-ganglia simulation and CMA-ES optimization (JNE-110355 rebuild)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Kavineshvar Ranak Nakkeeran" },
]
dependencies = [
  "jax>=0.6",
  "jaxlib>=0.6",
  "optuna>=4.0",
  "cma>=4.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["bgnet*"]
exclude = ["legacy*", "tests*", "scripts*", "configs*", "results*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
